<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Solutions Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

</body>


<div class="page-container">
    <!-- Header Section -->
    <header class="header-banner">
        <h1>Our Solutions</h1>
    </header>

    <!-- Navigation Bar -->
    <div class="nav-container">
<nav>
    <a href="index.html">Home</a>
    <a href="impact.html">Impact</a>
    <a href="solutions.html">Solutions</a>
    <a href="#">Contact</a>
    </nav>

        <!-- Page Main Title Box -->
        <div class="main-title-box">
            <h2>What WE OFFER</h2>
</div>

<!-- Main Content Area -->
        <main class="content-grid">
            <!-- Left Side: Solution Info Blocks -->
            <div class="info-blocks">
                <div class="card">

                    <h3>Enterprise Software</h3>
                </div>
                <div class="card">
                    <h3> Cloud Intergration</h3>
                </div>
                <div class="card">
                    <h3> Data Analytics </h3>
                </div>
                <div class="card">
                    <h3> Cybersecurity </h3>
                </div>
            </div>

            <!-- Right Side: Contact/Inquiry Form -->
            <section class="inquiry-form-container">
                <div class="form-header">
                    <span class="line"></span>
                    <span class="form-title"> GET A QUOTE </span>
                    <span class="line" </span>
                </div>

                <form class="inquiry-form">
                    <div class="form-row">
                        <div class="form-row">
                            <div class="form-row">

                                <label for="first-name"> First name </label>

                                <input type="text" id="first-name" name="firstname">
                            </div>
                            <div class="form-group">
                            <label for="last-name"> Last name</label

                                <input type="text" id="last-name" name="lastname">
                            </div>
                            <div class="form-row">
                        <div class="form-group">

                            <label for="mobile-no"> Mobile no</label>

                            <input type="tel" id="mobile-no" name="mobileno">

                        </div>
                                <div class="form-group">

                                    <label for="email-id"></label>
                                    <input type="email" id="email-id" name="emailid">
                                </div>
                            </div>
                            <div class="form-group" full-width>
                                <label for ="message"> MESSAGE </label>
                                <textarea id ="message" name ="message" rows="4"> </textarea>
                            </div>

                            <button type="submit" class="submit-btn"> Submit Inquiry </button>
                        </div>
                    </div>
                </form>
            </section>
        </main>

        <!-- Footer Section -->
        <footer class="footer-banner">
            <p>@ 2025 Pest Control Solutions</p>
        </footer>
    </div>
</div>
</body>
</html>
